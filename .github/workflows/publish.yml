# Publishes the `nuagent` wheel to PyPI on a tag push like `v0.1.0`.
# Manual "Run workflow" dispatch builds but does NOT publish.
#
# Setup once (PyPI trusted publisher / OIDC, no secrets):
#   pypi.org -> account -> Publishing -> Add pending publisher
#     PyPI project name: nuagent
#     Owner: nustackdev
#     Repository name: nuagent
#     Workflow name: publish.yml
#     Environment name: (leave blank)
#
# Release flow:
#   1. Bump `version` in `pyproject.toml`.
#   2. Commit and push to main.
#   3. `git tag vX.Y.Z && git push origin vX.Y.Z`.
name: Publish nuagent to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release on tag push
  id-token: write   # needed for PyPI trusted publishing (OIDC)

concurrency:
  group: publish-nuagent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install build backend
        run: python -m pip install --upgrade build

      - name: verify tag matches pyproject.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      - name: build
        run: python -m build

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: create github release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: nuagent ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
